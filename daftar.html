<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar - GreenBin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth">
    <a href="index.html" class="logo"><span class="logo-ikon" aria-hidden="true">♻</span> GreenBin</a>

    <section class="auth-kartu">
      <h1>Buat akun</h1>
      <p class="sub">Daftar gratis untuk mulai memantau tempat sampah.</p>

      <form action="login.html" method="get">
        <div class="form-grup">
          <label for="nama">Nama lengkap</label>
          <input type="text" id="nama" name="nama" placeholder="Nama kamu" required>
        </div>
        <div class="form-grup">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="nama@email.com" required>
        </div>
        <div class="form-grup">
          <label for="password">Kata sandi</label>
          <input type="password" id="password" name="password" placeholder="Minimal 8 karakter" minlength="8" required>
        </div>
        <button type="submit" class="btn">Daftar</button>
      </form>

      <p class="auth-bawah">Sudah punya akun? <a href="login.html">Masuk</a></p>
    </section>
  </main>
</body>
</html>
