<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk - GreenBin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth">
    <a href="index.html" class="logo"><span class="logo-ikon" aria-hidden="true">♻</span> GreenBin</a>

    <section class="auth-kartu">
      <h1>Masuk</h1>
      <p class="sub">Masuk untuk membuka dashboard GreenBin.</p>

      <form action="dashboard.html" method="get">
        <div class="form-grup">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="nama@email.com" required>
        </div>
        <div class="form-grup">
          <label for="password">Kata sandi</label>
          <input type="password" id="password" name="password" placeholder="Masukkan kata sandi" required>
        </div>
        <button type="submit" class="btn">Masuk</button>
      </form>

      <p class="auth-bawah">Belum punya akun? <a href="daftar.html">Daftar</a></p>
    </section>
  </main>
</body>
</html>
